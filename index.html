<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>序章宠装模拟器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --line: #31384a;
      --text: #f4f1ea;
      --muted: #9aa3b5;
      --gold: #ffd76a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #07080c;
      color: var(--text);
    }
    .phone {
      width: min(440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      background:
        radial-gradient(420px 220px at 50% 0%, rgba(255, 196, 90, 0.16), transparent 70%),
        var(--bg);
      padding: 10px 12px 24px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #hud {
      flex: none;
      min-width: 92px;
      padding: 6px 10px 7px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 106, 0.55);
      background: linear-gradient(180deg, rgba(36, 32, 22, 0.96), rgba(18, 20, 28, 0.96));
    }
    .hud-kicker { font-size: 11px; letter-spacing: 0.08em; color: #e7d3a4; }
    #born-num {
      font-size: 26px;
      line-height: 1;
      font-weight: 800;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    #born-num.bump { animation: bump 0.32s ease; }
    @keyframes bump { 40% { transform: scale(1.12); } }
    .title-block { min-width: 0; }
    .eyebrow { margin: 0; color: #cbb892; letter-spacing: 0.22em; font-size: 11px; }
    h1 {
      margin: 2px 0 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #fff8de 10%, #ffd76a 48%, #e39b34 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .rules {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    a { color: var(--gold); }
    .bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 8px 0;
    }
    .gen-bar { grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
    .craft-bar { grid-template-columns: 1fr auto; }
    #craft-all {
      background: linear-gradient(180deg, #f3c85a, #c4891a);
      border-color: #ffe7ad;
      color: #2a220c;
      font-weight: 800;
    }
    button, select {
      font: inherit;
      color: var(--text);
      background: #232938;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 4px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary {
      background: linear-gradient(180deg, #4a4030, #2c261c);
      border-color: rgba(255, 215, 106, 0.55);
      color: #ffe7ad;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .swatch {
      width: 12px; height: 12px; border-radius: 3px; display: inline-block;
      border: 1px solid rgba(255,255,255,0.25); vertical-align: -1px; margin-right: 2px;
    }
    #count, #status { margin: 8px 0 0; min-height: 1.3em; font-size: 12px; color: var(--muted); }
    #status { color: var(--text); }
    .stage {
      position: relative;
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      min-height: 180px;
    }
    #board canvas { display: block; width: 100%; height: auto; }
    #empty {
      position: absolute; left: 12px; right: 12px; top: 64px;
      text-align: center; color: var(--muted); font-size: 13px;
    }
    #log {
      margin: 10px 2px 0;
      white-space: pre-wrap;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-height: 88px;
      overflow: auto;
    }
    #tip[hidden] { display: none; }
    #tip {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    #tip-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.62);
    }
    .tip-sheet {
      position: relative;
      width: min(440px, 100%);
      max-height: 82vh;
      overflow: auto;
      padding: 8px 12px calc(14px + env(safe-area-inset-bottom));
      animation: tip-in 0.18s ease;
    }
    @keyframes tip-in { from { transform: translateY(24px); opacity: 0.4; } }
    .tip-bar { display: flex; justify-content: flex-end; }
    #tip-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: #2a3142;
    }
    .item-card {
      position: relative;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 215, 106, 0.16), transparent 52%),
        linear-gradient(180deg, #242a38, #151922);
      border: 1px solid rgba(255, 215, 106, 0.35);
      border-radius: 18px;
      padding: 14px 14px 12px;
      overflow: hidden;
    }
    .item-card:before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 4px;
      background: var(--tier, var(--gold));
    }
    .card-head { display: flex; gap: 10px; align-items: center; }
    .card-icon {
      width: 43px; height: 43px; flex: none;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
    }
    .card-name { margin: 0; font-size: 16px; font-weight: 800; color: var(--tier-ink, var(--text)); }
    .meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .score-block {
      margin-top: 10px;
      padding: 6px 8px 10px;
      text-align: center;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.22);
    }
    .score-kicker { margin: 0; letter-spacing: 0.42em; font-size: 12px; color: #e7d3a4; }
    .score-num {
      margin: 0;
      font-size: 64px;
      line-height: 0.92;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #fff8dc 8%, #ffd76a 42%, #f0a020 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .grade {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .grade-legend { background: rgba(255, 215, 106, 0.18); color: #ffd76a; }
    .grade-great { background: rgba(126, 182, 255, 0.16); color: #9ec4ff; }
    .grade-good { background: rgba(125, 222, 160, 0.15); color: #8ee0aa; }
    .grade-ok { background: rgba(255, 255, 255, 0.06); color: #d5dbe6; }
    .grade-low { background: rgba(255, 255, 255, 0.04); color: #8b93a3; }
    .score-expect { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .meter {
      position: relative;
      height: 8px;
      margin: 10px 6px 0;
      border-radius: 99px;
      background: #0d1016;
    }
    .meter-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6d5830, #ffd76a);
    }
    .meter-expect {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 14px;
      margin-left: -1px;
      background: #fff;
    }
    .meter-scale {
      display: flex;
      justify-content: space-between;
      margin: 4px 6px 0;
      color: var(--muted);
      font-size: 11px;
    }
    .affixes { list-style: none; margin: 10px 0 0; padding: 0; }
    .affix { padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
    .affix-top { display: flex; align-items: baseline; gap: 8px; }
    .affix-name { font-size: 15px; }
    .affix-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .affix-val.is-max { color: var(--gold); }
    .affix-score { margin-left: auto; color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
    .affix-tag {
      font-size: 11px;
      color: #1a1408;
      background: var(--gold);
      border-radius: 999px;
      padding: 0 6px;
      font-weight: 800;
    }
    .affix-bar { height: 6px; margin-top: 6px; border-radius: 99px; background: #0d1016; overflow: hidden; }
    .affix-bar span { display: block; height: 100%; border-radius: inherit; }
    .affix-range { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .sum { margin: 8px 0 0; color: #e7d3a4; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .pick-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px 8px;
      font-weight: 700;
      background: linear-gradient(180deg, #4a4030, #2c261c);
      border-color: rgba(255, 215, 106, 0.55);
      color: #ffe7ad;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div id="hud" title="每生成 1 件 1 级装备加 1。合成和清空不减少。">
        <div class="hud-kicker">1 级已生成</div>
        <div id="born-num">0</div>
      </div>
      <div class="title-block">
        <p class="eyebrow">生成 · 合成 · 评分</p>
        <h1>序章宠装模拟器</h1>
      </div>
    </div>
    <p class="rules">
      点装备查看属性。部位随机。一键合成成功得到高 1 级同部位，失败得到一件同级新装备。五级不会再被合成。背包超过 999 件不能再生成。
      <a href="宠物装备详细.md">配置说明</a>
    </p>
    <div class="bar gen-bar">
      <button id="gen1" class="primary">生成1</button>
      <button id="gen10">生成10</button>
      <button id="gen100">生成100</button>
    </div>
    <div class="bar craft-bar">
      <button id="craft-all">一键合成</button>
      <button id="clear-all">清空</button>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:#f4f4f4"></i>1 白</span>
      <span><i class="swatch" style="background:#2f9e44"></i>2 绿</span>
      <span><i class="swatch" style="background:#2f6fe0"></i>3 蓝</span>
      <span><i class="swatch" style="background:#8a45d6"></i>4 紫</span>
      <span><i class="swatch" style="background:#e07a1a"></i>5 橙</span>
    </div>
    <p id="count">共 0 件</p>
    <p id="status"></p>
    <div class="stage">
      <div id="empty">背包是空的。先生成 1 级装备。</div>
      <div id="board"></div>
    </div>
    <div id="log"></div>
  </div>
  <div id="tip" hidden>
    <button id="tip-backdrop" type="button" aria-label="关闭属性"></button>
    <div class="tip-sheet">
      <div class="tip-bar"><button id="tip-close" type="button" aria-label="关闭">×</button></div>
      <div id="detail"></div>
    </div>
  </div>
  <script src="vendor/pixi.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
